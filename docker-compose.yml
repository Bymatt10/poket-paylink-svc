services:
  poket-paylink-svc:
    build: .
    restart: unless-stopped
    # init: reap de zombies de Chromium. ipc: host: sin esto Chromium se cae
    # por falta de /dev/shm.
    init: true
    ipc: host
    env_file: .env
    environment:
      # Redis del compose, sobreescribe el REDIS_URL del .env.
      REDIS_URL: redis://redis:6379
      HEADLESS: "true"
    # Solo loopback: este servicio acuña cobros; NO exponerlo a internet.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
